# Tells Pages CMS where to upload images
media:
  input: public/images
  output: /images

# Defines the editable portfolio content
content:
  - name: site
    label: Site Settings
    type: file
    path: data/site.json
    fields:
      - name: metadata
        label: Search and Browser Metadata
        type: object
        required: true
        fields:
          - name: title
            label: Site Title
            type: string
            required: true
          - name: description
            label: Site Description
            type: text
            required: true
      - name: footer
        label: Footer
        type: object
        required: true
        fields:
          - name: copyrightName
            label: Copyright Name
            type: string
            required: true
      - name: hero
        label: Introduction
        type: object
        required: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: role
            label: Role
            type: string
            required: true
          - name: eyebrow
            label: Eyebrow
            type: string
            required: true
          - name: summary
            label: Summary
            type: rich-text
            required: true
            options:
              format: markdown
              media: false
          - name: secondaryAction
            label: Secondary Action
            type: object
            required: true
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: URL
                type: string
                required: true
          - name: tertiaryAction
            label: Tertiary Action
            type: object
            required: true
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: href
                label: URL
                type: string
                required: true
      - name: accessibility
        label: Accessibility Labels
        type: object
        required: true
        fields:
          - name: backToTop
            label: Back-to-top Button
            type: string
            required: true
          - name: toggleNavigation
            label: Navigation Toggle
            type: string
            required: true
          - name: closeNavigation
            label: Close Navigation
            type: string
            required: true
          - name: mobileNavigation
            label: Mobile Navigation
            type: string
            required: true
          - name: primaryNavigation
            label: Primary Navigation
            type: string
            required: true
          - name: opensInNewTab
            label: Opens in a New Tab
            type: string
            required: true
          - name: proficiencyLinkLabel
            label: Proficiency Link Label
            type: string
            required: true
            description: Use {name} where the proficiency name should appear.
          - name: projectLinks
            label: Project Link Labels
            type: object
            required: true
            fields:
              - name: git
                label: Source Code
                type: string
                required: true
              - name: web
                label: Website
                type: string
                required: true
              - name: deployed
                label: Deployed Package
                type: string
                required: true
              - name: design
                label: Design
                type: string
                required: true
              - name: fallback
                label: Other Link
                type: string
                required: true
      - name: notFound
        label: Not-found Page
        type: object
        required: true
        fields:
          - name: eyebrow
            label: Eyebrow
            type: string
            required: true
          - name: title
            label: Heading
            type: string
            required: true
          - name: description
            label: Description
            type: rich-text
            required: true
            options:
              format: markdown
              media: false
          - name: linkLabel
            label: Home Link Label
            type: string
            required: true

  - name: about
    label: About
    type: file
    path: data/about.json
    fields:
      - name: heading
        label: Heading
        type: string
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          media: false

  - name: proficiencies
    label: Proficiencies
    type: file
    path: data/proficiencies.json
    fields:
      - name: heading
        label: Heading
        type: string
      - name: items
        label: Proficiencies
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: href
            label: Documentation URL
            type: string
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - name: auth0
                  label: Auth0
                - name: azure
                  label: Azure
                - name: csharp
                  label: C#
                - name: cypress
                  label: Cypress
                - name: docker
                  label: Docker
                - name: dotnet
                  label: .NET
                - name: git
                  label: Git
                - name: javascript
                  label: JavaScript
                - name: jest
                  label: Jest
                - name: nextjs
                  label: Next.js
                - name: react
                  label: React
                - name: sqlserver
                  label: SQL Server
                - name: tailwind
                  label: Tailwind CSS
                - name: typescript
                  label: TypeScript
                - name: xunit
                  label: xUnit
          - name: iconAlt
            label: Icon Alt Text
            type: string

  - name: experience
    label: Experience
    type: file
    path: data/experience.json
    fields:
      - name: heading
        label: Heading
        type: string
      - name: items
        label: Roles
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{jobTitle} — {jobLink.name}"
        fields:
          - name: jobTitle
            label: Job Title
            type: string
            required: true
          - name: jobLink
            label: Employer
            type: object
            required: true
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: href
                label: Website URL
                type: string
                required: true
          - name: date
            label: Dates
            type: string
            required: true
            description: A display range such as “Apr 2025 - Present”.
          - name: highlights
            label: Highlights
            type: rich-text
            list: true
            required: true
            description: Each item becomes one bullet point. Markdown is supported.
            options:
              format: markdown
              media: false
          - name: pills
            label: Technologies
            type: string
            list: true

  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    fields:
      - name: heading
        label: Heading
        type: string
        required: true
      - name: items
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{heading}"
        fields:
          - name: heading
            label: Name
            type: string
            required: true
          - name: image
            label: Project Image
            type: image
            description: Optional. Use a screenshot or other representative image.
          - name: imageAlt
            label: Project Image Alt Text
            type: string
            description: Required when a project image is set.
          - name: imageLayout
            label: Image Layout
            type: select
            options:
              values:
                - name: side
                  label: Side-by-side
                - name: wide
                  label: Full-width
          - name: body
            label: Description
            type: rich-text
            required: true
            options:
              format: markdown
              media: false
          - name: link
            label: Links
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{type}"
            fields:
              - name: type
                label: Link Type
                type: select
                required: true
                options:
                  values:
                    - name: design
                      label: Design
                    - name: deployed
                      label: Deployed Package
                    - name: web
                      label: Website
                    - name: git
                      label: GitHub Source
              - name: href
                label: URL
                type: string
                required: true
          - name: pills
            label: Technologies
            type: string
            list: true
          - name: order
            label: Display Order
            type: number
            required: true
            description: Higher numbers are shown first.
